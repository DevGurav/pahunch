<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>keyboard: focus indicator removed</title>
<style>*:focus { outline: none; } .styled:focus { box-shadow: 0 0 0 3px #f90; }</style>
</head>
<body>
  <label for="user">Username</label> <input id="user" type="text">
  <button type="button" id="go">Login</button>
  <button type="button" id="help" class="styled">Help</button>
</body>
</html>
