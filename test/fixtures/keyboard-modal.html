<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>keyboard: announcement modal open on load</title></head>
<body>
  <label for="user">Username</label> <input id="user" type="text">
  <button type="button" id="go">Login</button>
  <div role="dialog" aria-modal="true" aria-labelledby="t" id="modal">
    <h2 id="t">Announcement</h2>
    <button type="button" id="close">Close</button>
    <a href="#more" id="more">Read more</a>
  </div>
  <script>
    // Correct modal behaviour: focus starts in the dialog and Tab stays inside it.
    const first = document.getElementById('close'), last = document.getElementById('more');
    first.focus();
    document.getElementById('modal').addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      e.preventDefault();
      (document.activeElement === first ? last : first).focus();
    });
  </script>
</body>
</html>
